name: Check all

on: push

env:
  NODE_VERSION: 24

jobs:
  threed:
    name: 3D
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: yarn install

      - name: Depcheck
        run: yarn workspace @tanatloc/3d run depcheck

      - name: Prettier
        run: yarn workspace @tanatloc/3d run prettier

      - name: Lint
        run: yarn workspace @tanatloc/3d run lint

      - name: Doc
        run: yarn workspace @tanatloc/3d run doc

      - name: Test
        run: yarn workspace @tanatloc/3d run doc

      - name: Build
        run: yarn workspace @tanatloc/3d run build

  converters:
    name: Converters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Corepack
        run: corepack enable

      - name: Install
        run: sudo apt install -y clang-format cppcheck shellcheck

      - name: Format
        run: yarn workspace @tanatloc/converters format

      - name: CPPCceck
        run: yarn workspace @tanatloc/converters cppcheck

      - name: Shellcheck
        run: yarn workspace @tanatloc/converters shellcheck

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Corepack
        run: corepack enable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate build configuration
        uses: docker/build-push-action@v7
        with:
          call: check

  formula-validator:
    name: Formula Validator
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: yarn install

      - name: Depcheck
        run: yarn workspace @tanatloc/formula-validator run depcheck

      - name: Prettier
        run: yarn workspace @tanatloc/formula-validator run prettier

      - name: Lint
        run: yarn workspace @tanatloc/formula-validator run lint

      - name: Doc
        run: yarn workspace @tanatloc/formula-validator run lint

      - name: Test
        run: yarn workspace @tanatloc/formula-validator run lint

      - name: Build
        run: yarn workspace @tanatloc/formula-validator run build

  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: yarn install

      - name: Depcheck
        run: yarn workspace @tanatloc/web run depcheck

      - name: Prettier
        run: yarn workspace @tanatloc/web run prettier

      - name: Lint
        run: yarn workspace @tanatloc/web run lint

      - name: Build
        run: yarn workspace @tanatloc/web run build

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
